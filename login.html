<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Byte Burger | Login</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cg fill='%2339ff14'%3E%3Crect x='4' y='1' width='8' height='1'/%3E%3Crect x='3' y='2' width='10' height='1'/%3E%3Crect x='2' y='3' width='12' height='2'/%3E%3Crect x='1' y='6' width='14' height='1'/%3E%3Crect x='2' y='11' width='12' height='1'/%3E%3Crect x='3' y='12' width='10' height='2'/%3E%3C/g%3E%3Crect x='2' y='8' width='12' height='2' fill='%23b6ff00'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css">

</head>


<body>

  <main class="login-container">


    <!-- ==========================================
         MARCA
    =========================================== -->

    <div class="brand">

      <div class="brand-icon">
        <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" aria-hidden="true"><g fill="#39ff14"><rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="10" height="1"/><rect x="2" y="3" width="12" height="2"/><rect x="1" y="6" width="14" height="1"/><rect x="2" y="11" width="12" height="1"/><rect x="3" y="12" width="10" height="2"/></g><rect x="2" y="8" width="12" height="2" fill="#b6ff00"/><g fill="#050505"><rect x="6" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/><rect x="7" y="3" width="1" height="1"/></g></svg>
      </div>

      <h1>
        BYT<em>E</em>
      </h1>

      <p>
        Burger • PDV
      </p>

    </div>


    <!-- ==========================================
         CARD DE LOGIN
    =========================================== -->

    <section class="login-card">

      <h2>
        Entrar no sistema
      </h2>

      <p class="login-description">
        Acesse sua conta para utilizar o sistema de vendas.
      </p>


      <!-- ERRO -->

      <div
        id="errorMessage"
        class="error-message">
      </div>


      <!-- SUCESSO -->

      <div
        id="successMessage"
        class="success-message">
      </div>


      <!-- ========================================
           LOGIN COM E-MAIL
      ========================================= -->

      <form id="loginForm">


        <div class="field">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            placeholder="seuemail@email.com"
            autocomplete="email"
            required>

        </div>


        <div class="field">

          <label for="password">
            Senha
          </label>

          <input
            id="password"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required>

        </div>


        <button
          class="login-button"
          id="loginButton"
          type="submit">

          Entrar

        </button>

      </form>


      <!-- ========================================
           DIVISOR
      ========================================= -->

      <div class="divider">
        ou
      </div>


      <!-- ========================================
           LOGIN COM GOOGLE
      ========================================= -->

      <button
        class="google-button"
        id="googleButton"
        type="button">

        🔵 Entrar com Google

      </button>

    </section>


    <!-- ==========================================
         RODAPÉ
    =========================================== -->

    <div class="footer">
      Byte Burger • Sistema de Ponto de Venda
    </div>


  </main>


  <!-- ==================================================
       FIREBASE + AUTENTICAÇÃO
  =================================================== -->

  <script type="module">

    /* =================================================
       IMPORTS DO FIREBASE

       signInWithPopup (em vez de signInWithRedirect):
       o fluxo de redirect depende de armazenamento
       (sessionStorage/IndexedDB) sobrevivendo à ida e
       volta para o domínio do Google. Em ambiente local
       isso costuma falhar silenciosamente. O popup evita
       esse problema porque a autenticação toda acontece
       numa janela separada.
    ================================================= */

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    /* =================================================
       CONFIGURAÇÃO DO FIREBASE
    ================================================= */

    const firebaseConfig = {
        apiKey: "AIzaSyCDBhEvK6KxiSAFbQKxHWPdyfSe553M17s",
        authDomain: "sistema-pdv-usjt.firebaseapp.com",
        projectId: "sistema-pdv-usjt",
        storageBucket: "sistema-pdv-usjt.firebasestorage.app",
        messagingSenderId: "803225322517",
        appId: "1:803225322517:web:89b28e01bbd0d5f484ba1c"
    };


    /* =================================================
       INICIALIZAÇÃO DO FIREBASE
    ================================================= */

    const app =
      initializeApp(firebaseConfig);


    /* =================================================
       FIREBASE AUTH
    ================================================= */

    const auth =
      getAuth(app);


    /* =================================================
       ELEMENTOS DA PÁGINA
    ================================================= */

    const loginForm =
      document.getElementById("loginForm");


    const emailInput =
      document.getElementById("email");


    const passwordInput =
      document.getElementById("password");


    const loginButton =
      document.getElementById("loginButton");


    const googleButton =
      document.getElementById("googleButton");


    const errorMessage =
      document.getElementById("errorMessage");


    const successMessage =
      document.getElementById("successMessage");


    /* =================================================
       MOSTRAR ERRO
    ================================================= */

    function showError(message) {

      errorMessage.textContent =
        message;

      errorMessage.classList.add("show");

    }


    /* =================================================
       ESCONDER ERRO
    ================================================= */

    function hideError() {

      errorMessage.textContent =
        "";

      errorMessage.classList.remove("show");

    }


    /* =================================================
       MOSTRAR SUCESSO
    ================================================= */

    function showSuccess(message) {

      successMessage.textContent =
        message;

      successMessage.classList.add("show");

    }


    /* =================================================
       ESCONDER SUCESSO
    ================================================= */

    function hideSuccess() {

      successMessage.textContent =
        "";

      successMessage.classList.remove("show");

    }


    /* =================================================
       LOGIN COM E-MAIL E SENHA
    ================================================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        hideError();
        hideSuccess();

        loginButton.disabled =
          true;

        googleButton.disabled =
          true;

        loginButton.textContent =
          "Entrando...";


        try {

          await signInWithEmailAndPassword(
            auth,
            emailInput.value.trim(),
            passwordInput.value
          );


          showSuccess(
            "Login realizado com sucesso! Redirecionando..."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 500);


        } catch (error) {

          console.error(
            "Erro no login:",
            error
          );


          let message =
            "Não foi possível realizar o login.";


          switch (error.code) {

            case "auth/invalid-credential":

              message =
                "E-mail ou senha incorretos.";

              break;


            case "auth/user-not-found":

              message =
                "Usuário não encontrado.";

              break;


            case "auth/wrong-password":

              message =
                "Senha incorreta.";

              break;


            case "auth/invalid-email":

              message =
                "Digite um e-mail válido.";

              break;


            case "auth/user-disabled":

              message =
                "Esta conta foi desativada.";

              break;


            case "auth/too-many-requests":

              message =
                "Muitas tentativas. Aguarde alguns minutos e tente novamente.";

              break;


            case "auth/network-request-failed":

              message =
                "Erro de conexão. Verifique sua internet.";

              break;


            case "auth/api-key-not-valid":

              message =
                "A configuração do Firebase está incorreta. Verifique a API Key.";

              break;


            default:

              message =
                "Não foi possível realizar o login.";

              break;

          }


          showError(message);


          loginButton.disabled =
            false;

          googleButton.disabled =
            false;

          loginButton.textContent =
            "Entrar";

        }

      }
    );


    /* =================================================
       LOGIN COM GOOGLE (POPUP)
    ================================================= */

    googleButton.addEventListener(
      "click",
      async () => {

        hideError();
        hideSuccess();

        googleButton.disabled =
          true;

        loginButton.disabled =
          true;

        googleButton.textContent =
          "Abrindo Google...";


        try {

          const provider =
            new GoogleAuthProvider();


          /*
            Solicita explicitamente o e-mail
            da conta Google.
          */

          provider.addScope(
            "email"
          );


          /*
            Abre o seletor de conta do Google numa
            janela popup. A Promise só resolve quando
            o usuário termina o login (ou fecha/cancela
            a janela), então dá pra tratar sucesso e
            erro no mesmo lugar, sem depender de
            getRedirectResult() numa navegação futura.
          */

          const result =
            await signInWithPopup(
              auth,
              provider
            );


          console.log(
            "Login com Google concluído:",
            result.user.email
          );


          showSuccess(
            "Login com Google realizado! Redirecionando..."
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 500);


        } catch (error) {

          console.error(
            "Erro ao entrar com Google:",
            error
          );


          let message =
            "Não foi possível entrar com o Google.";


          switch (error.code) {

            case "auth/popup-closed-by-user":

              message =
                "A janela de login foi fechada antes de concluir.";

              break;


            case "auth/popup-blocked":

              message =
                "O navegador bloqueou a janela de login. Permita pop-ups para este site e tente novamente.";

              break;


            case "auth/cancelled-popup-request":

              // Acontece quando o usuário clica
              // duas vezes rápido — não é um erro
              // real, então não mostra mensagem.

              message =
                null;

              break;


            case "auth/unauthorized-domain":

              message =
                "Este domínio não está autorizado no Firebase Authentication. Adicione-o em Authentication → Settings → Authorized domains.";

              break;


            case "auth/account-exists-with-different-credential":

              message =
                "Já existe uma conta com este e-mail usando outro método de login.";

              break;


            case "auth/api-key-not-valid":

              message =
                "A configuração do Firebase está incorreta. Verifique a API Key.";

              break;


            case "auth/network-request-failed":

              message =
                "Erro de conexão. Verifique sua internet.";

              break;


            default:

              message =
                "Não foi possível entrar com o Google.";

              break;

          }


          if (message) {

            showError(message);

          }


          googleButton.disabled =
            false;

          loginButton.disabled =
            false;

          googleButton.textContent =
            "🔵 Entrar com Google";

        }

      }
    );

  </script>


</body>

</html>
